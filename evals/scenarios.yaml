- id: complaint-without-false-action
  turns:
    - user: "Quero reclamar, fui muito mal atendido na loja."
      includes_any: ["whatsapp", "e-mail", "email", "3321-4500"]
      excludes: ["registrei", "encaminhei", "ja abri"]
