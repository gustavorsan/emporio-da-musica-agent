      excludes: ["1.488"]

- id: shipped-order-with-passed-forecast
  customer_id: 2
  turns:
    - user: "Como está meu pedido 8?"
      tools: [get_order_status]
      includes: ["BRJL5544332BR"]
      includes_any: ["enviado", "a caminho", "despachado"]
      excludes: ["foi entregue", "esta atrasado"]

- id: return-without-receipt-date
  customer_id: 1
  turns:
    - user: "Meu pedido 4 foi entregue. Ainda está no prazo de devolução?"
      tools: [search_knowledge]
      includes_any: ["recebeu", "recebimento", "recebido"]

- id: regret-five-days
  turns:
    - user: "Comprei online, recebi há 5 dias e quero devolver."
      tools: [search_knowledge]
      includes: ["7", "embalagem"]
      excludes: ["ja registrei", "reembolso foi", "ja solicitei", "ja abri"]

- id: paraphrases-of-return
  turns:
    - user: "Não gostei do violão que comprei, e agora?"
