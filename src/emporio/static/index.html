<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empório da Música</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Empório da Música</h1>
        <p id="status">Assistente virtual · protótipo</p>
      </div>
      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="show-tools">
          <span>Mostrar ferramentas</span>
        </label>
        <button type="button" id="new-chat" class="secondary">Nova conversa</button>
      </div>
    </header>

    <main id="log" class="log" role="log" aria-live="polite" aria-label="Conversa"></main>

    <form id="composer" class="composer">
      <label for="message" class="visually-hidden">Sua mensagem</label>
      <textarea id="message" rows="1" maxlength="2000" placeholder="Escreva sua mensagem" autocomplete="off"></textarea>
      <button type="submit" id="send">Enviar</button>
    </form>
    <p class="footnote">Para consultar pedidos, o assistente pede o e-mail e o telefone do cadastro. É uma verificação de protótipo, não uma autenticação completa. A conversa se perde ao fechar a sessão.</p>
  </div>

  <template id="welcome-template">
    <section class="welcome">
      <h2>Olá! Como posso ajudar?</h2>
      <p>Pergunte sobre instrumentos, preços, pedidos e políticas da loja.</p>
      <div class="suggestions">
        <button type="button" class="suggestion">Quanto custa o Kalani KAL-700T no PIX?</button>
        <button type="button" class="suggestion">Tem violão até R$ 1.000?</button>
        <button type="button" class="suggestion">Me arrependi da compra, e agora?</button>
        <button type="button" class="suggestion">Cadê meu pedido?</button>
      </div>
    </section>
  </template>
</body>
</html>
